app = "no-te-dejes-atrapar"
primary_region = "dfw"

[build]

[env]
  ROCKET_ADDRESS = "0.0.0.0"
  ROCKET_PORT = "8080"

[processes]
  app = "./dont-get-got-online"

[http_service]
  processes = ["app"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
