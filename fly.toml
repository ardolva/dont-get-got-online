# fly.toml app configuration file generated for no-te-dejes-atrapar on 2026-08-29T22:27:47Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'no-te-dejes-atrapar'
primary_region = 'dfw'

[build]

[env]
  ROCKET_ADDRESS = '0.0.0.0'
  ROCKET_PORT = '8080'

[processes]
  app = './dont-get-got-online'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
